# @package _global_

# The hls4ml jets under the permutation group: a Deep Sets teacher and an MLP student.
defaults:
  - override /data: jets
  - override /net@teacher_net: deepsets
  - override /net@student_net: mlp_jets
  - override /trainer: gpu

teacher: deepsets
num_classes: 5
input_shape: [50, 16]

tags: ["jets", "deepsets", "permutation"]
experiment_name: distilling_symmetries_jets_deepsets

data:
  group: permutation
  batch_size: 1024

# The recipe of the sibling's 50-constituent row, read from its checkpoints and its runs'
# .hydra/config.yaml, so that hp_tag and config_hash name the teacher src/import_teacher.py
# brings in. The sibling also clipped gradients at 1.0, trained in 16-mixed precision and
# stopped early after 100 epochs without improvement; those trainer and callback settings
# stay this study's own.
teacher_lr: 0.0038020938205913656
teacher_batch_size: 2048
teacher_optimizer:
  weight_decay: 1.0e-7
teacher_scheduler:
  scheduler:
    patience: 80
hint_lr: 1.0e-3
relational_batch_size: 1024

extras:
  matmul_precision: highest
