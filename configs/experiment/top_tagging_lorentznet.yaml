# @package _global_

# The top-tagging set at 100 constituents under isotropic Lorentz boosts, with the sibling's
# LorentzNet as the teacher. Student I and Distillation I set the top-tagging student; the
# student keys stay at the study's defaults until then.
defaults:
  - override /data: top_tagging
  - override /net@teacher_net: lorentznet
  - override /trainer: gpu

teacher: lorentznet
num_classes: 2
# The nine converted columns and m2, which the teacher reads as its node scalar.
input_shape: [100, 10]

tags: ["top_tagging", "lorentznet", "lorentz_iso"]
experiment_name: distilling_symmetries_top_tagging_lorentznet

data:
  group: lorentz_iso

# The architecture and recipe of the sibling's row (jet_tagging_gdl,
# top_tagging/lorentznet/nconst100/baseline), read from its checkpoints and its runs'
# .hydra/config.yaml, so that hp_tag and config_hash name the teacher src/import_teacher.py
# brings in: the LorentzNet reference recipe, AdamW and a warm-up, cosine-restarts and decay
# schedule stepped per batch over 35 epochs of 9460 batches of 128 jets. The schedule is the
# sibling's (src/algorithms/utils/schedules.py there) and has no counterpart here, so this
# teacher is imported, not retrained. The sibling trained in float32 with TF32 matmuls and
# without gradient clipping; the trainer settings stay this study's own.
teacher_net:
  c_weight: 0.005
  dropout: 0.2
teacher_lr: 0.001
teacher_batch_size: 128
teacher_optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.01
# A node of its own, interpolated whole, so that it replaces the plateau scheduler of the study
# config rather than merging into it.
top_tagging_lorentznet_scheduler:
  scheduler:
    _target_: src.algorithms.utils.schedules.warmup_restarts_decay
    _partial_: true
    total_steps: 331100
    epochs: 35
    warmup: 4
    t0: 4
    t_mult: 2
    decay_epochs: 3
    gamma: 0.5
  interval: step
  frequency: 1
teacher_scheduler: ${top_tagging_lorentznet_scheduler}

extras:
  matmul_precision: highest
