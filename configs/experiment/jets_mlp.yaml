# @package _global_

# The MLP control teacher on [pt, etarel, phirel] under the permutation group, with the MLP
# student of the Deep Sets cell: the experiment its sibling checkpoints are imported under.
defaults:
  - override /data: jets
  - override /net@teacher_net: mlp_control
  - override /net@student_net: mlp_jets
  - override /trainer: gpu

teacher: mlp
num_classes: 5
input_shape: [50, 16]

tags: ["jets", "mlp", "permutation"]
experiment_name: distilling_symmetries_jets_mlp

data:
  group: permutation
  batch_size: 1024

# The recipe of the sibling's 50-constituent row, read from its checkpoints and its runs'
# .hydra/config.yaml, so that hp_tag and config_hash name the teacher src/import_teacher.py
# brings in: Adam without weight decay, the plateau scheduler at patience 80. The sibling
# also clipped gradients at 1.0, trained in 16-mixed precision and stopped early after 100
# epochs without improvement; those trainer and callback settings stay this study's own.
teacher_lr: 0.006231966644198026
teacher_batch_size: 2048
teacher_scheduler:
  scheduler:
    patience: 80
hint_lr: 1.0e-3
relational_batch_size: 1024

extras:
  matmul_precision: highest
