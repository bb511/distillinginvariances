# @package _global_

# The JetFormer control teacher of the top-tagging LorentzNet-m2 cell, on [pt, eta, phi] of
# 100 constituents, embedding no symmetry, imported from the sibling; the student keys are
# top_tagging_lorentznet_m2's.
defaults:
  - override /data: top_tagging
  - override /net@teacher_net: jetformer
  - override /net@student_net: mlp_top
  - override /trainer: gpu

teacher: jetformer
num_classes: 2
# The nine converted columns and m2; the teacher reads pt, eta and phi of them.
input_shape: [100, 10]

tags: ["top_tagging", "jetformer", "lorentz_iso"]
experiment_name: distilling_symmetries_top_tagging_jetformer

data:
  group: lorentz_iso
  batch_size: 1024

# The architecture and recipe of the sibling's row (jet_tagging_gdl,
# top_tagging/pt_eta_phi/jetformer/nconst100/baseline), read from its checkpoints and its
# runs' .hydra/config.yaml, so that hp_tag and config_hash name the teacher
# src/import_teacher.py brings in. The sibling also trained in 16-mixed precision and clipped
# gradients at 1.0; those settings stay this study's own.
teacher_net:
  embed_dim: 32
  num_heads: 8
  num_transformers: 5
teacher_lr: 0.009135148517570918
teacher_batch_size: 2048
teacher_optimizer:
  _target_: torch.optim.AdamW
  weight_decay: 0.01
# A node of its own, interpolated whole, so that it replaces the plateau scheduler of the study
# config rather than merging into it. Stepped per batch; total_steps, read from the main run's
# checkpoint, is 200 epochs of 591 batches of 2048 jets (the folds' 630 batches give 126000).
top_tagging_jetformer_scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${teacher_lr}
    total_steps: 118200
    pct_start: 0.2
  interval: step
  frequency: 1
teacher_scheduler: ${top_tagging_jetformer_scheduler}
hint_lr: 1.0e-3
relational_batch_size: 1024

extras:
  matmul_precision: highest
