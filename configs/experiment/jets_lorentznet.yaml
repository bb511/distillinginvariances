# @package _global_

# The hls4ml jets under isotropic Lorentz boosts: a LorentzNet teacher and an MLP student.
defaults:
  - override /data: jets
  - override /net@teacher_net: lorentznet
  - override /net@student_net: mlp_jets
  - override /trainer: gpu

teacher: lorentznet
num_classes: 5
# The 16 record columns and m2, which the teacher reads as its node scalar.
input_shape: [50, 17]

tags: ["jets", "lorentznet", "lorentz_iso"]
experiment_name: distilling_symmetries_jets_lorentznet

data:
  group: lorentz_iso
  # Memory follows the squared multiplicity; 512 fits a 32 GB V100 at 32 constituents.
  batch_size: 512

# The recipe of the sibling's 50-constituent row, read from its checkpoints and its runs'
# .hydra/config.yaml, so that hp_tag and config_hash name the teacher src/import_teacher.py
# brings in: Adam without weight decay, the plateau scheduler at patience 80. The sibling
# trained in float32 with TF32 matmuls (matmul_precision high) and stopped early after 100
# epochs without improvement; those settings stay this study's own. Batch 1024 takes about
# 22 GB at 50 constituents.
teacher_lr: 0.0016106992417331738
teacher_batch_size: 1024
teacher_scheduler:
  scheduler:
    patience: 80
hint_lr: 1.0e-3
relational_batch_size: 256

trainer:
  gradient_clip_val: 1.0 # as in the sibling's teacher recipe

extras:
  matmul_precision: highest
