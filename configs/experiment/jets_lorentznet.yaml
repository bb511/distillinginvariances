# @package _global_

# The hls4ml jets under isotropic Lorentz boosts: a LorentzNet teacher and an MLP student.
defaults:
  - override /data: jets
  - override /net@teacher_net: lorentznet
  - override /net@student_net: mlp_jets_abs
  - override /trainer: gpu

teacher: lorentznet
num_classes: 5
# The 16 record columns and m2, which the teacher reads as its node scalar.
input_shape: [50, 17]

tags: ["jets", "lorentznet", "lorentz_iso"]
experiment_name: distilling_symmetries_jets_lorentznet

# The students' batch, that of every jets cell. The teacher was imported before the student
# keys took these values, so its config_hash here differs from its manifest's: it is read by
# its run directory and never retrained.
data:
  group: lorentz_iso
  batch_size: 1024

# The recipe of the sibling's 50-constituent row, read from its checkpoints and its runs'
# .hydra/config.yaml, so that hp_tag and config_hash name the teacher src/import_teacher.py
# brings in: Adam without weight decay, the plateau scheduler at patience 80. The sibling
# trained in float32 with TF32 matmuls (matmul_precision high), clipped gradients at 1.0 and
# stopped early after 100 epochs without improvement; those settings stay this study's own,
# since trainer settings reach every student of the cell. Batch 1024 takes about 22 GB at 50
# constituents.
teacher_lr: 0.0016106992417331738
teacher_batch_size: 1024
teacher_scheduler:
  scheduler:
    patience: 80
hint_lr: 1.0e-3
relational_batch_size: 1024

extras:
  matmul_precision: highest
