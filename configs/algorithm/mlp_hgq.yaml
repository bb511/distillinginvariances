# The cell's MLP student trained quantisation-aware with HGQ2 (Keras on JAX), for synthesis by
# alkaid.
_target_: src.algorithms.mlp_hgq.MLPHGQ

# As classifier.yaml: the module instantiates net, optimizer and scheduler from the plain dicts
# it keeps in its hparams.
_recursive_: false
_convert_: all

# The float student's config: the port is built from the MLPStudent it instantiates, layer for
# layer, and the FLOPs are counted on that float network.
net: ${student_net}
num_classes: ${num_classes}
input_shape: ${input_shape}

# A Classifier or DistillationModule checkpoint of the same student, or its run directory, whose
# Linear layers are copied into the port before its bits are seeded; null trains from scratch.
init_from: null
calibration_rows: 100000 # training rows on which the datalane bits of a copy are seeded

quantisation:
  data_bits: 14 # i + f of every datalane of a copy, i traced
  weight_bits: 8 # bits of every weight and bias of a copy
  float_mode: false # every quantiser the identity, for the comparison with the float student

# null trains on the labels; a temperature trains under the KD objective (method=hgq_kd), the
# teacher's logits from the cell's cache, plus alpha times the cross entropy.
temperature: null
alpha: 0.0

# The recipe of the synthesised designs (user, 9 Nov 2026): 1000 epochs from the float
# checkpoint, beta rising geometrically from 1e-8 to 1e-6 over the run.
beta: null # the EBOPs weight follows beta_schedule
beta_schedule: # [epoch, beta, interpolation] points of HGQ2's PieceWiseSchedule
  - [0, 1.0e-8, log]
  - [1000, 1.0e-6, constant]
floatx: float64 # reproduces the fixed-point arithmetic exactly
jax_platform: ${trainer.accelerator}
jax_devices: ${trainer.devices}

# Keras's, a partial: configure_optimizers passes the schedule as its learning_rate.
optimizer:
  _target_: keras.optimizers.Adam
  _partial_: true

# Stepped per batch by Keras, a partial: configure_optimizers passes the run's steps as
# decay_steps. JEDI-linear restarts its cosine every 100 epochs; this one decays once.
scheduler:
  _target_: keras.optimizers.schedules.CosineDecay
  _partial_: true
  initial_learning_rate: 3.0e-3
  alpha: 3.3333e-4 # the floor, 1e-6
