# @package _global_

# Evaluate one trained checkpoint: the fold split, then the test split at the temperatures fitted
# on the fold, under every probe; append one row per (split, probe) to the results table.
defaults:
  - _self_
  - study: default
  - data: jets
  - net@teacher_net: deepsets
  - net@student_net: mlp_jets
  - algorithm: classifier
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - logger: mlflow
  - experiment: null
  - method: teacher
  - optional local: default
  - debug: null

task_name: "eval"

tags: ["dev"]

experiment_name: distilling_symmetries_dev

# Names the trained run (it ends every student hp_tag), so a seeded checkpoint is found by it.
seed: 12345
# Fixes the probe draws for every checkpoint, whatever seed trained it, so the seeds of a
# headline row are compared on the same g.x; coverage.yaml's seed must equal it.
probe_seed: 12345

# null: the main run; an integer in 1..data.n_folds: that fold (train.yaml).
fold: null

run_stage: "eval"

# The manifest src/train.py left in the run directory of this stage and hyperparameter point,
# by the same convention; ckpt_path names a checkpoint directly instead, for a run with no manifest.
checkpoint_manifest_path: ${paths.log_dir}/${train_task}/${run_dir}/checkpoint_manifest.json
ckpt_path: null

# The fold's validation half, on which both temperatures are fitted, then the untouched test
# split.
eval_splits: [fold, test]

# The rows evaluated, validation and test alike: null for the run's own (the transformed
# rows for an augmented run), or canonical / transformed to read another regime's.
eval_data: null

# The invariance probes: n_draws independent transforms per sample, the first of which also
# goes through the teacher (the _g and tinv columns). lorentz_eta_max, max_shift and n_swaps
# are the groups' knobs, kept here rather than read from data.transform_kwargs so a probe can
# be widened without retraining. Each probe draws under a seed fixed by (seed, split, probe,
# batch), so the draws also depend on batch_size_eval and on the device type.
probe:
  n_draws: 10
  lorentz_eta_max: 1.0
  max_shift: null
  # Transpositions composed into each permutation of the slots; null draws a uniform one.
  n_swaps: null

# The groups probed after the cell's own (data.group); null takes the dataset's from
# src/vocabulary.py (PROBE_SUBGROUPS), [] probes the cell's group alone.
probe_subgroups: null

# Per-sample arrays (first draw: student and teacher logits at x and g.x, labels, the draw's
# magnitudes) written to <output_dir>/samples/: cell for the cell's own probe, all, or none.
dump_samples: cell

# The long-format results table; debug/default.yaml sets the path to null to keep a throwaway
# evaluation out of results/.
results:
  path: ${paths.results_dir}/results.csv

# Forward passes only, so a wider batch than training.
batch_size_eval: 1024

# Provenance a stage name alone does not carry, such as warm_hint for a relational student
# warm-started from the hint checkpoint.
variant: null
