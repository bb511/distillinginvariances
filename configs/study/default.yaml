# @package _global_

# What every entry point shares about the cell it works in: the teacher's own recipe, the
# run-directory convention, and where the upstream teacher and hint runs are found. An
# experiment config sets the values; a method config interpolates them.

# The export column naming the teacher architecture, and the shapes every net is built at.
teacher: deepsets
num_classes: 5
input_shape: [50, 16]

# The teacher's recipe lives beside algorithm.*, so a student of the same experiment keeps its
# own optimiser; method/teacher.yaml interpolates it into algorithm.
teacher_lr: 1.0e-3
teacher_batch_size: 128
teacher_optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: ${teacher_lr}
  weight_decay: 0.0
teacher_scheduler:
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: ${monitor_mode}
    patience: 20
    factor: 0.1
  monitor: ${monitor}
  interval: epoch
  frequency: 1

# The hint stage's learning rate, which also names its run directory.
hint_lr: 1.0e-3

relational_batch_size: 1024

# "main" or "fold_<i>", derived from fold: the run's label in its run directory and its
# teacher cache.
run_label: ${fold_label:${fold},main}

# hydra/default.yaml writes a single run to run_dir and a multirun point to
# run_dir_parent/${hp_tag}, so the two land in the same place; stage and hp_tag come from the
# method config.
# The regime as a path segment: transformed and augmented runs carry the name of the cell's
# group (transformed_z), canonical runs are shared across the cells.
regime_tag: ${regime_tag:${data.regime},${data.group}}
run_dir_parent: ${data.dataset}/${teacher}/${regime_tag}/${stage}/${run_label}
run_dir: ${run_dir_parent}/${hp_tag}

# The MLflow run name: the hash of the output directory, unique per run.
run_name: ${short_hash:${hydra:runtime.output_dir},12}

# Upstream artefacts by convention: the teacher and the hint run of this cell at their default
# learning rate, under the logs/<train_task> tree (debug/default.yaml points it at logs/debug).
train_task: train
teacher_hp_tag: lr${teacher_lr}
hint_hp_tag: lr${hint_lr}
# The regime the teacher run and its cache come from: the augmented regime distils the
# canonical teacher, whose outputs on a canonical row stand for any transform of it.
teacher_regime: ${regime_of_teacher:${data.regime}}
teacher_regime_tag: ${regime_tag:${teacher_regime},${data.group}}
teacher_run_dir: ${paths.log_dir}/${train_task}/${data.dataset}/${teacher}/${teacher_regime_tag}/teacher/${run_label}/${teacher_hp_tag}
# The run's own regime: the augmented rows of E5 are baseline and KD only, so no augmented
# stage reads a hint run.
hint_run_dir: ${paths.log_dir}/${train_task}/${data.dataset}/${teacher}/${regime_tag}/hint/${run_label}/${hint_hp_tag}
teacher_cache: ${paths.base_data_dir}/teacher_cache/${data.dataset}/${teacher}/${teacher_regime_tag}/${run_label}.npz

# Filled by train.py from the manifests of the two run directories above, before instantiation.
teacher_ckpt: null
hint_ckpt: null
